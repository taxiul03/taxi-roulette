<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лохотрон Такси</title>
    
    <link rel="icon" type="image/png" href="yak.png">
    <link rel="apple-touch-icon" href="yak.png">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c3e50; 
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            background-color: #1a252f;
            color: #f1c40f; 
            width: 100%;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            border-bottom: 4px dashed #f1c40f;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-top: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 4px solid #f1c40f;
            position: relative;
            z-index: 5;
        }
        h2 { margin-top: 0; font-size: 20px; color: #2c3e50; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #2c3e50; }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        button.start-btn {
            background-color: #f1c40f;
            color: #1a252f;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: 0.2s;
            box-shadow: 0 4px 0 #d4ac0d;
        }
        button.start-btn:active { 
            transform: translateY(4px);
            box-shadow: 0 0 0 #d4ac0d;
        }
        
        button.install-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 3px 0 #2980b9;
            transition: opacity 0.5s ease;
        }
        button.install-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #2980b9;
        }

        #roulette-container {
            display: none;
            margin-top: 20px;
            position: relative;
            z-index: 5;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            z-index: 10;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }
        canvas {
            border-radius: 50%;
            border: 6px solid #1a252f;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #fff;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        .modal-content {
            background: #f1c40f;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            border: 6px solid #1a252f;
            position: relative;
            max-width: 320px;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
        }
        .yak-img-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #1a252f;
            margin: 0 auto 15px auto;
            background: #fff;
        }
        .yak-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .win-text {
            font-size: 24px;
            font-weight: bold;
            color: #1a252f;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .highlight-number {
            font-size: 42px;
            color: #e74c3c;
            display: inline-block;
            margin: 5px 0;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }
        .win-phrase {
            font-size: 20px;
            color: #1e8449;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .confetti {
            position: fixed;
            top: -50px;
            z-index: 90;
            user-select: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* Футер */
        .footer {
            margin-top: auto;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: #7f8c8d;
            font-size: 12px;
        }
        .footer-left { font-weight: bold; }
        .footer-left span { color: #f1c40f; font-size: 14px; }
    </style>
</head>
<body>

    <header>ТАКСИ МЕСТНОЕ<br>70-00-77, 40-40-40</header>

    <div class="container" id="setup-screen">
        <h2>Настройки розыгрыша</h2>
        
        <div class="input-group">
            <label>Всего номеров на смене:</label>
            <input type="number" id="total-numbers" value="10" min="2" max="20" oninput="if(this.value > 20) this.value = 20;">
        </div>

        <div class="input-group">
            <label>Исключить номера (через пробел):</label>
            <input type="text" id="excluded-numbers" placeholder="Например: 2 5 8">
        </div>

        <button class="start-btn" id="start-button" onclick="startRoulette()">КРУТИТЬ ЛОХОТРОН!</button>
        <button class="install-btn" id="install-button" onclick="promptInstall()">Создать ярлык на рабочем столе?</button>

        <p id="error-msg" style="color: red; font-weight: bold; display: none;"></p>
    </div>

    <div id="roulette-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <div id="modal">
        <div class="modal-content">
            <div class="yak-img-container">
                <img src="yak.png" alt="Якубович" onerror="this.style.display='none';">
            </div>
            <div class="win-text" id="win-announcement">Цифра <br><span class="highlight-number">X</span><br> на барабане!</div>
            <div class="win-phrase" id="win-phrase">Удачи на трассе!</div>
            <button class="start-btn" onclick="closeModal()">Сыграть еще раз</button>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">Created by Sheriff <span>⭐</span></div>
        <div class="footer-right">Ver.007, november 2026</div>
    </div>

    <script>
        let participants = [];
        let canvas = document.getElementById("wheel");
        let ctx = canvas.getContext("2d");
        let currentAngle = 0;
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        // Обновленные фразы
        const phrases = [
            "Хорошей дороги!",
            "Удачи на трассе!",
            "Ровной дороги!",
            "Счастливого пути!",
            "Удачной поездки!",
            "Лёгкой дороги!",
            "В добрый путь!",
            "Безопасной дороги!",
            "Ни гвоздя, ни жезла!"
        ];

        // Тексты для кнопки
        const buttonTexts = [
            "Крутить лохотрон!",
            "Запускай рулетку!",
            "Вжжжух!",
            "Поехали!",
            "Врубай передачу!",
            "Погнали!",
            "Пуск!",
            "Начать шоу!",
            "Педаль в пол!"
        ];
        let currentBtnIndex = 0;

        // Логика кнопки "Создать ярлык"
        let deferredPrompt;
        const installBtn = document.getElementById('install-button');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Таймер на исчезновение через 7 секунд
        setTimeout(() => {
            if(installBtn) {
                installBtn.style.opacity = '0';
                setTimeout(() => installBtn.style.display = 'none', 500);
            }
        }, 7000);

        function promptInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            } else {
                alert("Чтобы добавить ярлык:\nНажмите кнопку 'Поделиться' (или меню браузера) и выберите 'На экран Домой' / 'Добавить на гл. экран'.");
            }
            installBtn.style.display = 'none';
        }

        // Обновление текста главной кнопки
        function updateStartButton() {
            document.getElementById('start-button').innerText = buttonTexts[currentBtnIndex];
            currentBtnIndex = (currentBtnIndex + 1) % buttonTexts.length;
        }

        // Вызываем при загрузке страницы
        window.onload = function() {
            updateStartButton();
        };

        function startRoulette() {
            let total = parseInt(document.getElementById('total-numbers').value);
            let excludedRaw = document.getElementById('excluded-numbers').value;
            let errorMsg = document.getElementById('error-msg');

            if (total > 20) total = 20;

            let excluded = excludedRaw.split(/[\s,]+/).map(n => parseInt(n)).filter(n => !isNaN(n));
            
            participants = [];
            for (let i = 1; i <= total; i++) {
                if (!excluded.includes(i)) {
                    participants.push(i);
                }
            }

            if (participants.length < 2) {
                errorMsg.innerText = "Ошибка! Должно быть минимум 2 участника.";
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.style.display = "none";
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('roulette-container').style.display = 'block';

            drawRouletteWheel();
            spin();
        }

        function drawRouletteWheel() {
            let arc = Math.PI / (participants.length / 2);
            ctx.clearRect(0,0,300,300);

            for(let i = 0; i < participants.length; i++) {
                let angle = currentAngle + i * arc;
                ctx.fillStyle = (i % 2 === 0) ? "#f1c40f" : "#1a252f";
                ctx.beginPath();
                ctx.arc(150, 150, 150, angle, angle + arc, false);
                ctx.arc(150, 150, 0, angle + arc, angle, true);
                ctx.fill();
                ctx.save();

                ctx.fillStyle = (i % 2 === 0) ? "#1a252f" : "#f1c40f";
                ctx.translate(150 + Math.cos(angle + arc / 2) * 110, 
                              150 + Math.sin(angle + arc / 2) * 110);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                let text = participants[i];
                ctx.font = 'bold 24px Arial';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }
        }

        function rotateWheel() {
            spinTime += 30;
            if(spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            let spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            currentAngle += (spinAngle * Math.PI / 180);
            drawRouletteWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function throwConfetti() {
            const symbols = ['🚕', '💸', '🎉', '🏁', '✨'];
            for (let i = 0; i < 40; i++) {
                let conf = document.createElement('div');
                conf.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.fontSize = (Math.random() * 15 + 15) + 'px';
                document.body.appendChild(conf);
                
                setTimeout(() => conf.remove(), 4000);
            }
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            let degrees = currentAngle * 180 / Math.PI + 90;
            let arcd = 360 / participants.length;
            let index = Math.floor((360 - degrees % 360) / arcd);
            
            setTimeout(() => {
                document.getElementById('win-announcement').innerHTML = "Цифра <br><span class='highlight-number'>" + participants[index] + "</span><br> на барабане!";
                
                let randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                document.getElementById('win-phrase').innerText = randomPhrase;

                document.getElementById('modal').style.display = 'flex';
                throwConfetti();
            }, 500);
        }

        function spin() {
            spinAngleStart = Math.random() * 10 + 20;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3 + 4 * 1000;
            rotateWheel();
        }

        function easeOut(t, b, c, d) {
            let ts = (t/=d)*t;
            let tc = ts*t;
            return b+c*(tc + -3*ts + 3*t);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('roulette-container').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
            updateStartButton(); // Меняем текст кнопки для следующего раза
        }
    </script>
</body>
</html>
